<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaaS Vendas — Sistema de Vendas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/app.css">
  <script defer src="js/api.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8">
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-xl bg-indigo-600 text-white mb-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
      </div>
      <h1 class="text-2xl font-bold">SaaS Vendas</h1>
      <p class="text-slate-500 text-sm mt-1">Gestão de vendas e estoque</p>
    </div>
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1">Email</label>
        <input type="email" id="loginEmail" required class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="admin@saasvendas.com">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Senha</label>
        <input type="password" id="loginPass" required class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="••••••">
      </div>
      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition">Entrar</button>
      <p id="loginError" class="text-red-500 text-sm text-center hidden"></p>
    </form>
    <div class="mt-6 text-xs text-slate-400 text-center">
      Acesso inicial: <b>admin@saasvendas.com</b> / <b>Admin@123</b>
    </div>
  </div>
</div>

<!-- APP SHELL -->
<div id="appShell" class="hidden min-h-screen flex">
  <!-- Sidebar -->
  <aside class="w-64 bg-slate-900 text-white flex flex-col">
    <div class="p-5 border-b border-slate-700">
      <div class="font-bold text-lg">SaaS Vendas</div>
      <div class="text-xs text-slate-400 mt-1" id="userName"></div>
    </div>
    <nav class="flex-1 p-3 space-y-1 text-sm">
      <a data-view="dashboard" class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-800 cursor-pointer">📊 Dashboard</a>
      <a data-view="products" class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-800 cursor-pointer">📦 Produtos</a>
      <a data-view="customers" class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-800 cursor-pointer">👥 Clientes</a>
      <a data-view="orders" class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-800 cursor-pointer">🧾 Pedidos</a>
      <a data-view="reports" class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-800 cursor-pointer">📈 Relatórios</a>
      <a data-view="users" class="nav-link admin-only flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-800 cursor-pointer hidden">👤 Usuários</a>
    </nav>
    <div class="p-3 border-t border-slate-700">
      <button id="logoutBtn" class="w-full text-left px-3 py-2 rounded-lg hover:bg-slate-800 text-sm">🚪 Sair</button>
    </div>
  </aside>

  <!-- Main -->
  <main class="flex-1 p-6 overflow-auto">
    <div id="viewContainer"></div>
  </main>
</div>

<!-- Modal container -->
<div id="modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-auto">
    <div class="flex items-center justify-between p-5 border-b">
      <h3 id="modalTitle" class="font-bold text-lg"></h3>
      <button id="modalClose" class="text-slate-400 hover:text-slate-700 text-2xl leading-none">&times;</button>
    </div>
    <div id="modalBody" class="p-5"></div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="hidden fixed bottom-5 right-5 bg-slate-900 text-white px-4 py-3 rounded-lg shadow-lg z-50"></div>

</body>
</html>
